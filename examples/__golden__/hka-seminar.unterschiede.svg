<tspan font-weight="700">Schnittstellen</tspan>
</tspan>
</text>
<text xml:space="preserve" font-family="&quot;Inter&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#000000">
<tspan x="434.9" y="460.87">
<tspan>Geschlossen – nicht standardisiert</tspan>
</tspan>
</text>
<text xml:space="preserve" font-family="&quot;Inter&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#000000">
