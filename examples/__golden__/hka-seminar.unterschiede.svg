</tspan>
</text>
<text xml:space="preserve" font-family="&quot;Inter&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#000000">
<tspan x="434.9" y="677.47">
<tspan>Niedrig – Netzbetreiber im Vendor-Lock-in</tspan>
</tspan>
</text>
<text xml:space="preserve" font-family="&quot;Inter&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#000000">
<tspan x="1123.45" y="677.47">
<tspan>Hoch – Multi-Vendor-Strategie</tspan>
</tspan>
</text>
