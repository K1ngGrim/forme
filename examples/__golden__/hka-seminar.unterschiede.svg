</tspan>
</text>
<text xml:space="preserve" font-family="&quot;Inter&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#000000">
<tspan x="434.9" y="605.27">
<tspan>Langsam – Innovation nur in geschlossenen Systemen</tspan>
</tspan>
</text>
<text xml:space="preserve" font-family="&quot;Inter&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#000000">
<tspan x="1123.45" y="605.27">
<tspan>Schneller – fördert Kreativität durch offene Standards</tspan>
</tspan>
</text>
<text xml:space="preserve" font-family="&quot;Inter&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#000000">
