# Publishes a GitHub release with the CLI (npm package) and the VS Code extension when a version
# tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`. The docs link to
# releases/latest/download/forme-cli.tgz and releases/latest/download/forme.vsix.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forme/web exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm --filter @forme/cli bundle
      - run: npm pack ./packages/cli/dist && mv forme-cli-*.tgz forme-cli.tgz
      - run: pnpm --filter forme-vscode package && cp apps/vscode/forme.vsix forme.vsix

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" forme-cli.tgz forme.vsix --title "Forme $GITHUB_REF_NAME" --generate-notes
