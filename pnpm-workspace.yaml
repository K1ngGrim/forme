packages:
  - packages/*
  - apps/*

# Only install versions that have been public for at least a day (minutes).
minimumReleaseAge: 1440

# Dependencies allowed to run install scripts.
# `allowBuilds` is read by pnpm >= 11, `onlyBuiltDependencies` by pnpm 10.
allowBuilds:
  esbuild: true
  keytar: false
  '@vscode/vsce-sign': false
onlyBuiltDependencies:
  - esbuild
# Not needed for `vsce package` (publishing credentials only).
ignoredBuiltDependencies:
  - keytar
  - '@vscode/vsce-sign'
